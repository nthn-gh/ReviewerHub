<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Basic Science Reviewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:#0f1528;color:#f8fafc;min-height:100vh;padding:1.5rem}
  h2{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:.5rem}
  .progress-bar{height:8px;border-radius:999px;background:rgba(255,255,255,0.08);margin-bottom:1.5rem;overflow:hidden}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#22d3ee);transition:width .5s ease}
  .question{font-size:1.05rem;font-weight:500;margin-bottom:1.25rem;line-height:1.5}
  .choices{display:flex;flex-direction:column;gap:.65rem}
  .choice-btn{
    padding:.85rem 1.1rem;border-radius:10px;border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.05);color:#f8fafc;font-size:.95rem;
    cursor:pointer;text-align:left;transition:all .2s ease;font-family:'Inter',sans-serif;
  }
  .choice-btn:hover:not(:disabled){background:rgba(124,58,237,0.25);border-color:rgba(124,58,237,0.5)}
  .choice-btn.correct{background:rgba(16,185,129,0.2);border-color:#10b981;color:#10b981}
  .choice-btn.wrong{background:rgba(239,68,68,0.2);border-color:#ef4444;color:#ef4444}
  .choice-btn:disabled{cursor:not-allowed}
  .feedback{margin-top:1rem;padding:.75rem 1rem;border-radius:8px;font-size:.9rem;font-weight:500;display:none}
  .feedback.show{display:block}
  .feedback.correct{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3)}
  .feedback.wrong{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3)}
  .next-btn{
    margin-top:1.25rem;padding:.7rem 1.75rem;border-radius:10px;
    background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;
    font-weight:700;font-size:.95rem;cursor:pointer;border:none;display:none;
    font-family:'Outfit',sans-serif;transition:transform .2s;
  }
  .next-btn:hover{transform:translateY(-2px)}
  .next-btn.show{display:inline-flex;align-items:center;gap:.4rem}
  .meta{display:flex;justify-content:space-between;font-size:.82rem;color:#64748b;margin-bottom:.75rem}
  .score-display{text-align:center;padding:2rem 1rem}
  .score-big{font-family:'Outfit',sans-serif;font-size:4rem;font-weight:900;color:#a78bfa}
  .score-label{color:#64748b;font-size:.95rem;margin:.5rem 0 1.5rem}
  .play-again{padding:.7rem 2rem;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:#fff;font-weight:700;cursor:pointer;border:none;font-family:'Outfit',sans-serif;font-size:1rem}
</style>
</head>
<body>
<div id="quizArea">
  <div class="meta">
    <span>🔬 Basic Science</span>
    <span id="qCounter">Question 1 / 10</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
  <h2 id="questionText">Loading...</h2>
  <div class="choices" id="choicesArea"></div>
  <div class="feedback" id="feedbackEl"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next ›</button>
</div>
<div id="resultsArea" style="display:none">
  <div class="score-display">
    <div style="font-size:3rem;margin-bottom:.5rem" id="resultEmoji">🎉</div>
    <div class="score-big" id="finalScore">0/10</div>
    <div class="score-label" id="finalMsg">Here's your score!</div>
    <div style="font-size:.85rem;color:#64748b;margin-bottom:1.5rem" id="finalSub"></div>
    <button class="play-again" onclick="restartQuiz()">🔄 Play Again</button>
  </div>
</div>

<script>
const questions = [
  {q:"What is the basic unit of life?",choices:["Atom","Cell","Molecule","Organ"],correct:1,exp:"The cell is the smallest structural and functional unit of all living things."},
  {q:"Which planet is known as the Red Planet?",choices:["Venus","Jupiter","Mars","Saturn"],correct:2,exp:"Mars appears red due to iron oxide (rust) on its surface."},
  {q:"What gas do plants absorb from the air during photosynthesis?",choices:["Oxygen","Nitrogen","Carbon Dioxide","Hydrogen"],correct:2,exp:"Plants absorb CO₂ and release O₂ during photosynthesis."},
  {q:"What is the hardest natural substance on Earth?",choices:["Gold","Iron","Quartz","Diamond"],correct:3,exp:"Diamond scores 10 on the Mohs hardness scale — the highest possible."},
  {q:"Which organ pumps blood throughout the body?",choices:["Liver","Kidney","Lung","Heart"],correct:3,exp:"The heart is a muscular organ that pumps blood through the circulatory system."},
  {q:"What is the chemical symbol for water?",choices:["WA","H2O","HO","W2O"],correct:1,exp:"Water is made of 2 hydrogen atoms and 1 oxygen atom: H₂O."},
  {q:"Which type of energy does the Sun primarily give off?",choices:["Chemical energy","Nuclear energy","Light and heat energy","Electrical energy"],correct:2,exp:"The Sun emits light (radiant) and heat (thermal) energy through nuclear fusion."},
  {q:"What do you call animals that eat only plants?",choices:["Carnivores","Omnivores","Herbivores","Decomposers"],correct:2,exp:"Herbivores are plant-eaters (e.g., cows, rabbits)."},
  {q:"What is the largest organ of the human body?",choices:["Liver","Brain","Skin","Intestine"],correct:2,exp:"The skin is the body's largest organ, covering the entire body surface."},
  {q:"What force keeps objects on the ground?",choices:["Magnetism","Friction","Gravity","Tension"],correct:2,exp:"Gravity is the force of attraction between masses, pulling objects toward Earth."},
];

let current = 0, score = 0, answered = false, startTime = Date.now();

function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('qCounter').textContent = `Question ${current+1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = ((current+1)/questions.length*100)+'%';
  document.getElementById('questionText').textContent = q.q;
  const fb = document.getElementById('feedbackEl');
  fb.className = 'feedback'; fb.textContent = '';
  document.getElementById('nextBtn').className = 'next-btn';

  const area = document.getElementById('choicesArea');
  area.innerHTML = q.choices.map((c,i) =>
    `<button class="choice-btn" onclick="selectAnswer(${i})" id="choice-${i}">${String.fromCharCode(65+i)}. ${c}</button>`
  ).join('');
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const fb = document.getElementById('feedbackEl');

  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  if (idx === q.correct) {
    score++;
    document.getElementById('choice-'+idx).className = 'choice-btn correct';
    fb.className = 'feedback correct show';
    fb.textContent = '✅ Correct! ' + q.exp;
  } else {
    document.getElementById('choice-'+idx).className = 'choice-btn wrong';
    document.getElementById('choice-'+q.correct).className = 'choice-btn correct';
    fb.className = 'feedback wrong show';
    fb.textContent = '❌ Not quite. ' + q.exp;
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) showResults();
  else loadQuestion();
}

function showResults() {
  const timeSeconds = Math.round((Date.now() - startTime) / 1000);
  const pct = Math.round(score/questions.length*100);
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  document.getElementById('finalScore').textContent = score + '/' + questions.length;
  const emoji = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'📖';
  const msg = pct===100?'Perfect Score!':pct>=80?'Excellent work!':pct>=60?'Good job!':'Keep studying!';
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('finalSub').textContent = `You answered ${score} out of ${questions.length} correctly.`;

  // Send score to parent
  try {
    window.parent.postMessage({ type:'QUIZ_COMPLETE', score, total:questions.length, timeSeconds }, '*');
  } catch(e) {}
}

function restartQuiz() {
  current = 0; score = 0; startTime = Date.now();
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
